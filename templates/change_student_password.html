<!DOCTYPE html>
<html>
<head>
    <title>Change Student Password</title>
    <style>
        body{
            font-family:Arial, sans-serif;
            background:#f2f2f2;
            text-align:center;
        }

        .box{
            width:350px;
            margin:120px auto;
            padding:20px;
            background:white;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
        }

        input{
            width:90%;
            padding:10px;
            margin:10px;
            border-radius:5px;
            border:1px solid #ccc;
        }

        button{
            padding:10px 20px;
            background:#5f2c82;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:#4b1f6b;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Change Student Password</h2>

    <form method="POST">
        <input type="text" name="student_id" placeholder="Student ID" required><br>
        <input type="password" name="new_password" placeholder="New Password" required><br>
        <button type="submit">Change Password</button>
    </form>
</div>

</body>
</html>
